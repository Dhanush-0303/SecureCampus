{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="text-muted mb-1">Total Students</h6>
                    <h3 class="fw-bold mb-0">1,248</h3>
                </div>
                <div class="bg-primary text-white p-3 rounded-circle">
                    <i class="bi bi-person-badge fs-4"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="text-muted mb-1">Security Score</h6>
                    <h3 class="fw-bold mb-0">98.5%</h3>
                </div>
                <div class="bg-success text-white p-3 rounded-circle">
                    <i class="bi bi-shield-check fs-4"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="text-muted mb-1">Active Sessions</h6>
                    <h3 class="fw-bold mb-0">42</h3>
                </div>
                <div class="bg-info text-white p-3 rounded-circle">
                    <i class="bi bi-activity fs-4"></i>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
