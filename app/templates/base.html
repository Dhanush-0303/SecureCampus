<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureCampus{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="preloader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar Component -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-primary border-bottom border-light">
                <i class="bi bi-shield-lock-fill me-2"></i>SecureCampus
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="{{ url_for('dashboard.index') }}" class="list-group-item list-group-item-action bg-transparent text-body fw-semibold">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="{{ url_for('dashboard.students') }}" class="list-group-item list-group-item-action bg-transparent text-body fw-semibold">
                    <i class="bi bi-people me-2"></i>Students
                </a>
                <a href="{{ url_for('dashboard.settings') }}" class="list-group-item list-group-item-action bg-transparent text-body fw-semibold">
                    <i class="bi bi-gear me-2"></i>Settings
                </a>
            </div>
        </div>

        <!-- Content Area -->
        <div id="page-content-wrapper">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg border-bottom px-4" style="background-color: var(--bg-surface);">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary btn-sm" id="menu-toggle"><i class="bi bi-list"></i></button>
                    <div class="ms-auto d-flex align-items-center gap-3">
                        <button class="btn btn-link text-body p-0" id="theme-toggle">
                            <i class="bi bi-moon-stars fs-5" id="theme-icon"></i>
                        </button>
                        <span class="fw-semibold">Admin User</span>
                    </div>
                </div>
            </nav>

            <main class="container-fluid p-4">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            <footer class="footer mt-auto py-3 text-center border-top" style="background-color: var(--bg-surface);">
                <div class="container">
                    <span class="text-muted">&copy; 2026 SecureCampus. Enterprise Security Standard.</span>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Hide preloader when fully loaded
            const preloader = document.getElementById('preloader');
            if (preloader) preloader.style.display = 'none';

            // Sidebar Toggle
            const menuToggle = document.getElementById('menu-toggle');
            const wrapper = document.getElementById('wrapper');
            if (menuToggle && wrapper) {
                menuToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    wrapper.classList.toggle('toggled');
                });
            }

            // Theme Toggle Switcher
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const htmlElement = document.documentElement;

            const savedTheme = localStorage.getItem('theme') || 'light';
            htmlElement.setAttribute('data-theme', savedTheme);
            if (themeIcon) {
                themeIcon.className = savedTheme === 'dark' ? 'bi bi-sun fs-5' : 'bi bi-moon-stars fs-5';
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const currentTheme = htmlElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    
                    htmlElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    
                    if (themeIcon) {
                        themeIcon.className = newTheme === 'dark' ? 'bi bi-sun fs-5' : 'bi bi-moon-stars fs-5';
                    }
                });
            }
        });
    </script>
</body>
</html>
