services:
  - type: web
    name: securecampus
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: securecampus-db
          property: connectionString

databases:
  - name: securecampus-db
    plan: free